server:
  port: 8888
spring:
  application:
    name: aiDemo2
  servlet:
    multipart:
      enabled: true
      # 单个文件最大限制 (默认 1MB)
      max-file-size: 50MB
      # 整个请求最大限制 (默认 10MB)
      max-request-size: 50MB
  
  # HTTP 编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  
  # Jackson 时间序列化配置
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
  
  # Redis 配置：用于会话存储
  data:
    redis:
      # Redis 服务器地址
      host: localhost
      # Redis 端口
      port: 6379
      # 数据库索引（0-15），默认使用 0
      database: 0
      # 连接超时时间（毫秒）
      timeout: 3000ms
      # Lettuce 连接池配置
      lettuce:
        pool:
          # 最大连接数（负数表示无限制）
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数
          min-idle: 2
          # 连接池最大阻塞等待时间（负数表示无限制）
          max-wait: -1ms
  
  # PostgreSQL Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/aidemo?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        # 维度需要和 embedding model 匹配，通义千问 text-embedding-v1 模型的维度是 1536
        dimension: 1536
        distance-type: COSINE
        initialize-schema: true
        remove-existing-vector-store-table: false
    dashscope:
      api-key: sk-9542ddc0ec1e40c0a4f1b0d3d389e778
      chat:
        options:
          model: qwen-turbo  # 改为基础模型，更稳定
          # 增加超时时间到60秒
          timeout: 60s
      embedding:
        options:
          # 指定使用阿里云通义千问的文本向量化模型
          model: text-embedding-v1
          # 增加embedding超时时间到30秒
          timeout: 30s
    # 优化重试配置
    retry:
      max-attempts: 5              # 增加重试次数
      backoff:
        initial-interval: 2000ms   # 增加初始重试间隔
        max-interval: 30000ms      # 增加最大重试间隔
        multiplier: 2.0


# MyBatis Plus 配置
mybatis-plus:
  # 指定 Type Handler 扫描包，确保我们自定义的 JsonbTypeHandler 被加载
  type-handlers-package: org.zerolg.aidemo2.handler
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 配置日志实现
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除配置 - 使用 Boolean 类型
      logic-delete-field: isDeleted # 全局逻辑删除的实体字段名
      logic-delete-value: true # 逻辑已删除值
      logic-not-delete-value: false # 逻辑未删除值

# 会话记忆配置
session:
  memory:
    # 会话 TTL（秒），默认 7 天
    ttl: 604800
    # 最大消息数量（超过后自动清理旧消息）
    max-messages: 100
    # 最大 token 预算（用于滑动窗口）
    max-prompt-tokens: 4000
    # 默认返回最近消息数量
    default-recent-count: 10
logging: 
  charset: 
    console: UTF-8 
    file: UTF-8

# 自定义配置
file:
  upload-dir: D:/uploads/ragFiles # Windows 示例路径, 请确保该目录存在
  # upload-dir: /tmp/ragFiles # Linux/macOS 示例路径

# AI 验证服务配置
ai:
  verification:
    # 是否启用详细验证（断言级别分析）
    enable-detailed-verification: false  # 临时禁用详细验证
    # 验证超时时间（秒）
    timeout-seconds: 15
    # 断言提取超时时间（秒）
    assertion-extraction-timeout-seconds: 8
    # 无支持内容处理配置
    unsupported-handling:
      # 无支持内容比例阈值（超过此比例触发处理）
      threshold: 0.4
      # 处理策略: MARK_WARNING, FILTER_CONTENT, REGENERATE, DOWNGRADE
      strategy: MARK_WARNING
      # 是否自动重新生成
      auto-regenerate: false
      # 是否显示详细分析
      show-details: true
      # 最大重新生成次数
      max-regeneration-attempts: 2

# 参数修正系统配置
parameter:
  correction:
    # 是否启用参数修正
    enabled: true
    # 默认最小置信度阈值
    default-min-confidence: 0.5
    # 是否启用详细日志
    verbose-logging: false
    # 最大候选数量
    max-candidates: 5
    # 是否启用性能监控
    performance-monitoring: false
    # 修正超时时间（毫秒）
    correction-timeout: 5000
    
    # 字符串标准化配置
    string-normalization:
      enabled: true
      remove-html-tags: true
      normalize-whitespace: true
      normalize-quotes: true
      fix-encoding: true
    
    # 数值标准化配置
    number-normalization:
      enabled: true
      handle-currency: true
      handle-percentage: true
      handle-chinese-numbers: true
      remove-thousands-separator: true
    
    # 实体解析配置
    entity-resolution:
      enabled: true
      min-similarity-threshold: 0.6
      enable-fuzzy-matching: true
      max-fuzzy-candidates: 3
    
    # 验证配置
    validation:
      enabled: true
      enable-type-validation: true
      enable-range-validation: true
      enable-constraint-validation: true

# 审计系统配置
audit:
  # 是否启用审计功能
  enabled: true
  # 审计详细级别: minimal, standard, detailed
  detail-level: standard
  # 审计数据保留期间（天）
  retention-period: P30D
  # 是否加密敏感数据
  encrypt-sensitive-data: true
  # 异步处理线程池大小
  async-pool-size: 10
  
  # 存储配置
  storage:
    # 存储类型: memory, redis, database
    type: database
    # Redis存储配置（当type=redis时生效）
    redis:
      key-prefix: "audit:"
      ttl-days: 30
  
  # 性能监控配置
  performance:
    # 是否启用性能监控
    enabled: true
    # 执行时间阈值（毫秒）
    execution-time-threshold: 30000
    # 参数修正时间阈值（毫秒）
    parameter-correction-time-threshold: 5000
    # 参数转换次数阈值
    parameter-transformations-threshold: 10
  
  # 决策上下文配置
  decision:
    # 是否启用决策上下文管理
    enabled: true
    # 相似度阈值
    similarity-threshold: 0.7
    # 决策历史保留数量
    max-history-size: 1000
    # 决策建议最小置信度
    min-suggestion-confidence: 0.5
  
  # 参数链记录配置
  parameter-chain:
    # 是否启用参数链记录
    enabled: true
    # 最大转换步骤数
    max-transformation-steps: 20
    # 是否记录详细元数据
    record-detailed-metadata: true
  
  # 安全配置
  security:
    # 敏感参数名称模式（正则表达式）
    sensitive-parameter-patterns:
      - ".*password.*"
      - ".*token.*"
      - ".*secret.*"
      - ".*key.*"
      - ".*credential.*"
    # 是否启用数据完整性检查
    enable-integrity-check: true
    # 是否启用访问控制
    enable-access-control: false
